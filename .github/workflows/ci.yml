name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate release pull request
        if: startsWith(github.head_ref, 'release/')
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --quiet origin main
          node scripts/check-release-pr.js

      - name: Unit tests
        run: npx vitest run --exclude='tests/e2e/**'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The official Playwright image ships Chromium and its system libraries, so
    # the job no longer runs `playwright install --with-deps`, whose apt step
    # could hang. Keep the tag equal to the @playwright/test version in
    # package-lock.json; the check below fails when they drift apart.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check the image matches the installed Playwright
        run: |
          node -e "
            const fs = require('node:fs');
            const { chromium } = require('@playwright/test');
            const version = require('@playwright/test/package.json').version;
            if (!fs.existsSync(chromium.executablePath())) {
              console.error('Chromium for @playwright/test ' + version + ' is not in this image; use mcr.microsoft.com/playwright:v' + version + '-noble.');
              process.exit(1);
            }
            console.log('Playwright ' + version + ': ' + chromium.executablePath());
          "

      - name: Extension E2E tests
        # Shorter than the job timeout, so a hung run fails this step and the
        # results are still uploaded below.
        timeout-minutes: 15
        run: xvfb-run -a npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14
